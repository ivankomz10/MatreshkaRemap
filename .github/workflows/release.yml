name: Build and release

# Build the Windows executable and the macOS app and publish them as a GitHub
# release.
#
# Two ways to cut a release:
#   * push a version tag, e.g. `git push origin v0.3`; or
#   * run the workflow by hand and type the version in the "version" box.
#
# Reusing a version that already has a release overwrites it: the old release
# and its tag are removed and recreated on the current commit, so bumping the
# version makes a new release and not bumping it replaces the last one.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, e.g. 0.3 (published as tag v0.3). Reusing an existing version overwrites its release."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        # A tag push carries the version in the ref; a manual run carries it in
        # the input. Either way it is normalised to a single `v`-prefixed tag.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.version }}"
          else
            raw="${{ github.ref_name }}"
          fi
          raw="$(echo "$raw" | tr -d '[:space:]')"
          if [ -z "$raw" ]; then
            echo "No version given." >&2
            exit 1
          fi
          case "$raw" in
            v*) tag="$raw" ;;
            *)  tag="v$raw" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing as $tag"

  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tool/requirements.txt pyinstaller

      - name: Build MatreshkaRemapRenderer.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build tool/build.spec

      - name: Stage the executable
        shell: bash
        run: |
          mkdir -p out
          cp "dist/MatreshkaRemapRenderer.exe" "out/MatreshkaRemapRenderer-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync sources into mac_build and pack the source archive
        run: python pack_mac.py

      - name: Build MatreshkaRemapRenderer.app
        # build_mac.sh makes its own venv inside mac_build, installs the
        # requirements and PyInstaller, and builds mac_build/dist/*.app. Left
        # unsigned here (ad-hoc); set the signing/notarization variables it
        # documents to produce a bundle that travels to other Macs.
        run: |
          chmod +x mac_build/build_mac.sh
          ./mac_build/build_mac.sh

      - name: Zip the app bundle and keep the source archive
        # ditto preserves the bundle's symlinks and metadata, which a plain zip
        # mangles into an app that will not launch.
        run: |
          mkdir -p out
          ditto -c -k --keepParent "mac_build/dist/MatreshkaRemapRenderer.app" "out/MatreshkaRemapRenderer-macos.zip"
          cp "MatreshkaRemapRenderer_mac.zip" "out/MatreshkaRemapRenderer-mac-source.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be attached
        run: find artifacts -type f -print

      - name: Overwrite any existing release for this version
        # If the version was not bumped, the release and its tag already exist.
        # Remove them so the tag re-points at this commit and the assets are
        # replaced cleanly rather than piling up alongside the old ones.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists -- deleting it and its tag to overwrite."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "No existing release for $TAG."
          fi

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/windows/*
            artifacts/macos/*
          generate_release_notes: true
          fail_on_unmatched_files: true
